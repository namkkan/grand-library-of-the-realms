<script>
const pages = [
{left:'<div class="titlepage"><div class="seal">✿</div><div class="kicker">The Seed Archives · Volume II</div><h1>GARDEN<br>DAHLIA</h1><div class="latin">Dahlia pinnata Cav.</div><p>A botanical record of broad, flattened fruits, living tubers and the many forms a seed may become.</p><p class="small">FLOWER RECORD 003</p></div>',right:'<div class="titlepage"><div class="kicker">The Grand Library of the Realms</div><h2 style="border:0;margin-top:30px">SEEDS IN BLOOM</h2><p>Studies in flowering plants, seed forms and the patient art of propagation.</p><div class="plate">BOTANICAL PLATE<br><br>Reserved for your own illustration<br><span class="small">Flower head · achene · tuber</span></div><p class="small">Compiled under the care of Professor Elowen Thorne<br>Department of Botany</p></div>'},
{left:'<div class="kicker">Reading Guide</div><h2>Within This Record</h2><ol class="contents"><li>Botanical Description</li><li>Seed Morphology</li><li>From Flower to Seed</li><li>Germination and Propagation</li><li>Approximate Time Record</li><li>Seed Collection and Storage</li><li>Field Notebook</li></ol><p class="small">Timings and fruit dimensions are approximate and vary with cultivar, specimen and growing conditions.</p>',right:'<div class="kicker">Before You Begin</div><h2>A Note on Dahlias</h2><p>Dahlias offer two different ways to continue a plant: through seed, which may produce surprising variation, or through tubers, which can preserve the traits of an individual cultivated plant.</p><p>This record follows the plant from flower head to dry fruit, then considers how each method of propagation shapes the next generation.</p><img class="photo" src="https://unsplash.com/photos/pdPcTycJIu0/download?force=true&w=1000" alt="Pink and white flower in a field"><p class="small">Reference photograph via <a href="https://unsplash.com/es/fotos/una-flor-rosa-y-blanca-en-un-campo-pdPcTycJIu0" target="_blank" rel="noopener">Unsplash</a>. Image display depends on the source host.</p>'},
{left:'<div class="kicker">Chapter I · The Living Plant</div><h2>Botanical Description</h2><p><em>Dahlia pinnata</em> is a flowering perennial native to Mexico and a member of the daisy family, Asteraceae. It grows from underground tubers that store nutrients and allow the plant to regrow after its above-ground stems die back.</p><p>Its upright stems carry green leaves divided into pointed leaflets with toothed edges. Flower heads vary enormously in size, colour and form across cultivated dahlias: white, pink, red, purple and many other shades occur. In simpler flower forms, the central disc is visible; highly double varieties may have dense arrangements of florets that conceal it.</p>',right:'<div class="kicker">Chapter I · Continued</div><h2>Season and Habitat</h2><p>Dahlias generally flower from summer into autumn. They thrive in sunny positions with fertile, well-drained soil and require protection from hard frost, particularly where tubers remain in the ground.</p><div class="plate">ILLUSTRATION SPACE<br>Leaf arrangement · toothed leaflet margins<br><span class="small">Add your own botanical drawing here</span></div><p class="small">Observation prompt: compare the leaves and flower heads of several cultivated specimens rather than relying on colour alone.</p>'},
{left:'<div class="kicker">Chapter II · Form and Identification</div><h2>Seed Morphology</h2><p>The structures commonly called dahlia seeds are technically <em>achenes</em>: dry, one-seeded fruits that do not open at maturity.</p><ul><li><strong>Shape:</strong> oblong and flattened, often narrow at one end and broader at the other, like a small paddle.</li><li><strong>Colour:</strong> often dark brown to nearly black when mature.</li><li><strong>Surface:</strong> usually fairly smooth, sometimes with fine longitudinal lines.</li></ul>',right:'<div class="kicker">Chapter II · Continued</div><h2>Details to Record</h2><ul><li><strong>Size:</strong> some examples measure approximately 9–13 mm long, though dimensions vary by specimen.</li><li><strong>Tip and base:</strong> a small crown-like remnant of floral structures may remain; a prominent feathery parachute is generally absent.</li></ul><p>Fruit shape can vary even within a single plant. For an illustration plate, compare several specimens and show both narrow, elongated and broader, flattened forms.</p><div class="plate">ACHENE STUDY<br>Side view · face view · size comparison<br><span class="small">Original illustration placeholder</span></div>'},
{left:'<div class="kicker">Chapter III · The Cycle of Formation</div><h2>From Flower to Seed</h2><p>A dahlia flower head contains numerous individual florets, as in other members of the daisy family. In simpler flower forms, the central disc is visible and may produce fertile fruits. In many highly double ornamental varieties, floral structures are modified and seed production may be limited or absent.</p><p>After successful pollination and fertilisation, the ovary develops into an achene. As the flower head fades, the fruits mature and darken.</p>',right:'<div class="kicker">Chapter III · Continued</div><h2>Seed or Tuber?</h2><p>The dried head can be inspected for mature fruits, although not every flower will produce viable seed.</p><p><strong>Seed:</strong> plants grown from seed may develop new combinations of colours and flower forms.</p><p><strong>Tuber:</strong> dividing a healthy tuber can preserve the characteristics of that individual plant, provided the division includes a viable growing point.</p><div class="plate">THE LIFE CYCLE<br>Flower head → pollination → achene<br><span class="small">Add arrows and observations to your own plate</span></div>'},
{left:'<div class="kicker">Chapter IV · Renewal</div><h2>Germination and Propagation</h2><p>Dahlias can be propagated by seed, by dividing tubers, or by taking cuttings. Each method serves a different purpose.</p><ul><li><strong>Sowing:</strong> sow seeds indoors in early to mid-spring, using seed compost in small pots or trays.</li><li><strong>Temperature:</strong> warm conditions encourage germination; a heated propagator can be useful.</li><li><strong>Moisture:</strong> keep the compost lightly moist, never saturated.</li><li><strong>Germination:</strong> often around 1–3 weeks under favourable conditions.</li></ul>',right:'<div class="kicker">Chapter IV · Continued</div><h2>Growing On</h2><ul><li><strong>Transplanting:</strong> move seedlings into individual pots once large enough to handle, then acclimatise them before planting outdoors after the last frost.</li><li><strong>Tuber division:</strong> each division must have a viable growing point or eye.</li><li><strong>Cuttings:</strong> young shoots can also be rooted to produce new plants.</li></ul><p>Seed propagation produces variation. Tuber division is more reliable when the aim is to preserve a particular cultivated variety.</p><div class="plate">PROPAGATION NOTES<br>Seed · tuber division · cuttings<br><span class="small">Space for your own diagrams</span></div>'},
{left:'<div class="kicker">Chapter V · Time and Development</div><h2>Approximate Time Record</h2><table><thead><tr><th>Stage</th><th>Approximate period</th></tr></thead><tbody><tr><td>Germination</td><td>Often 1–3 weeks</td></tr><tr><td>Early seedling growth</td><td>First few weeks after emergence</td></tr><tr><td>Established foliage</td><td>Following weeks as stems and leaves develop</td></tr><tr><td>First flowers from seed</td><td>Often within a few months; varies by variety and conditions</td></tr></tbody></table>',right:'<div class="kicker">Chapter V · Continued</div><h2>Seasonal Record</h2><table><thead><tr><th>Stage</th><th>Approximate period</th></tr></thead><tbody><tr><td>Flowering season</td><td>Generally summer to autumn</td></tr><tr><td>Fruit maturation</td><td>After flowering; varies with conditions and flower fertility</td></tr><tr><td>Seed collection</td><td>When fruits are mature and dry</td></tr><tr><td>Tuber development</td><td>During the growing season</td></tr></tbody></table><p class="small">These timings are approximate. Cultivar, temperature, light and growing conditions affect development.</p>'},
{left:'<div class="kicker">Chapter VI · Preservation</div><h2>Seed Collection and Storage</h2><ol><li>Choose a healthy plant and allow a flower head to remain until it has dried.</li><li>Inspect the mature head for developed fruits; not all may be fertile.</li><li>Remove the dry fruits carefully and separate them from loose floral material.</li></ol>',right:'<div class="kicker">Chapter VI · Continued</div><h2>Keeping the Record</h2><ol start="4"><li>Allow them to finish drying in a cool, well-ventilated place if needed.</li><li>Store them in a labelled paper envelope, protected from heat and humidity.</li></ol><p>Record the parent plant's flower colour and form. Compare seedlings with the original plant to observe how variable seed-grown dahlias can be.</p><div class="plate">COLLECTION LABEL<br>Species · date · parent plant · location<br><span class="small">Reserve space for a specimen envelope</span></div>'},
{left:'<div class="kicker">Chapter VII · Field Notebook</div><h2>Observation Notes</h2><h3>Foliage</h3><p>Record leaflet number, size, arrangement, toothed margins and the way leaves sit along the stem.</p><h3>Flower structure</h3><p>Compare single and double flower heads. Note whether the central disc is visible and whether the flower appears to develop mature fruits.</p><h3>Fruits</h3><p>Examine flattened, elongated achenes. Compare width, colour, surface markings and broader ends across several specimens.</p>',right:'<div class="kicker">Chapter VII · Closing Notes</div><h2>Below the Surface</h2><h3>Underground storage</h3><p>Record the tuber cluster and its growing points. Unlike the fruits, tubers store resources that allow the plant to regrow after dormancy.</p><div class="quote">“A flower may be bred for perfection, yet its offspring rarely obey the same design. I find this reassuring. Even in a garden shaped by human hands, nature keeps a few decisions to herself.”<br><span class="small">— From the field notes of Professor Elowen Thorne</span></div><div class="plate">FINAL BOTANICAL PLATE<br>Flower · achene · tuber<br><span class="small">Reserved for your own illustration</span></div><p class="small">End of Flower Record 003.</p>'}
];
let current=0;
const book=document.getElementById('book'), left=document.getElementById('left-page'), right=document.getElementById('right-page'), count=document.getElementById('page-count'), prev=document.getElementById('prev'), next=document.getElementById('next');
function render(index,animate=true){
 current=Math.max(0,Math.min(pages.length-1,index));
 left.innerHTML=pages[current].left+'<div class="folio">'+(current===0?'i':current*2)+' · THE SEED ARCHIVES</div>';
 right.innerHTML=pages[current].right+'<div class="folio">'+(current===0?'ii':current*2+1)+' · FLOWER RECORD 003</div>';
 count.textContent=current===0?'Cover':('Spread '+(current+1)+' of '+pages.length);
 prev.disabled=current===0;next.disabled=current===pages.length-1;
 document.querySelectorAll('.jump button').forEach(b=>b.classList.toggle('active',Number(b.dataset.page)===current));
 if(animate){book.classList.remove('turning');void book.offsetWidth;book.classList.add('turning');}
}
prev.addEventListener('click',()=>render(current-1));
next.addEventListener('click',()=>render(current+1));
document.querySelectorAll('.jump button').forEach(b=>b.addEventListener('click',()=>render(Number(b.dataset.page))));
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')render(current-1);if(e.key==='ArrowRight')render(current+1)});
let touchStart=null;book.addEventListener('touchstart',e=>{touchStart=e.changedTouches[0].clientX},{passive:true});book.addEventListener('touchend',e=>{if(touchStart===null)return;const dx=e.changedTouches[0].clientX-touchStart;if(Math.abs(dx)>55)render(current+(dx<0?1:-1));touchStart=null},{passive:true});
function responsive(){book.classList.toggle('single',window.matchMedia('(max-width:720px)').matches)}
window.addEventListener('resize',responsive);responsive();render(0,false);
</script>
